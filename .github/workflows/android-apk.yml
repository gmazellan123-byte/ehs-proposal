# 갤럭시(안드로이드)용 APK 빌드 → GitHub Releases에 업로드
# 다운로드 주소(항상 최신): https://github.com/gmazellan123-byte/ehs-proposal/releases/latest/download/ehs-proposal.apk
# APK는 웹 화면(GitHub Pages)을 여는 껍데기이므로 화면 수정 시 다시 빌드할 필요 없음.
# 다시 빌드가 필요한 경우: 앱 이름·아이콘 변경 → android/app/build.gradle 의 versionCode/versionName 올리고 커밋
name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: 서명키 준비
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD_RAW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::저장소 Settings → Secrets and variables → Actions 에 ANDROID_KEYSTORE_B64 가 없습니다"
            exit 1
          fi
          # 붙여넣을 때 섞인 공백·줄바꿈 제거
          printf '%s' "$KEYSTORE_B64" | tr -d ' \r\n\t' | base64 -d > android/app/release.keystore
          PW=$(printf '%s' "$KEYSTORE_PASSWORD_RAW" | tr -d ' \r\n\t')
          echo "::add-mask::$PW"
          echo "KEYSTORE_PASSWORD=$PW" >> "$GITHUB_ENV"
          echo "서명키 지문(앞 16자): $(sha256sum android/app/release.keystore | cut -c1-16)  (정상값: 527d5ef670576780)"
          if ! keytool -list -keystore android/app/release.keystore -storepass "$PW" -alias ehs >/dev/null 2>&1; then
            echo "::error::서명키를 열 수 없습니다. ANDROID_KEYSTORE_PASSWORD 값(비밀번호 32자) 또는 ANDROID_KEYSTORE_B64 값(긴 한 줄 전체)을 다시 확인해 등록하세요"
            exit 1
          fi
          keytool -list -v -keystore android/app/release.keystore -storepass "$PW" -alias ehs 2>/dev/null | grep "SHA256:"

      - name: APK 빌드
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: 서명 확인
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs "$APK"
          cp "$APK" ehs-proposal.apk

      - name: Releases에 업로드
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(grep -m1 'versionName' android/app/build.gradle | sed -E 's/.*"(.*)".*/\1/')
          TAG="android-v$VER"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" ehs-proposal.apk --clobber
          else
            gh release create "$TAG" ehs-proposal.apk --latest \
              --title "안전제안 안드로이드 앱 v$VER" \
              --notes "갤럭시(안드로이드)용 설치 파일입니다. 설치 안내: https://gmazellan123-byte.github.io/ehs-proposal/install.html"
          fi
      
      - name: 빌드 기록 보관
        uses: actions/upload-artifact@v4
        with:
          name: ehs-proposal-apk
          path: ehs-proposal.apk
