# 안드로이드 앱 실행 점검: 최신 APK를 에뮬레이터(Android 14·15)에서 실행해 화면·로그를 남김
name: Android APK 실행 점검

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Android APK"]
    types: [completed]

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        api: [34, 35]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: KVM 사용 설정
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: 최신 APK 받기
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download -p ehs-proposal.apk -R ${{ github.repository }}
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis_playstore
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash .github/scripts/android-smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-api${{ matrix.api }}
          path: out
